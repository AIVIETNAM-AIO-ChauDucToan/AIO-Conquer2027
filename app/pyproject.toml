[project]
name = "app"
version = "0.1.0"
description = "Streamlit demo client for the FastAPI backend"
readme = "README.md"
authors = [
    { name = "AIO-ChauDucToan", email = "ctoan501@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx",
    "streamlit",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project]
name = "backend"
version = "0.1.0"
description = "FastAPI service for model inference and PostgreSQL logging"
readme = "README.md"
authors = [
    { name = "AIO-ChauDucToan", email = "ctoan501@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ai",
    "asyncpg",
    "fastapi[standard]",
]

[tool.uv.sources]
ai = { path = "../ai", editable = true }

[tool.fastapi]
entrypoint = "backend.main:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
